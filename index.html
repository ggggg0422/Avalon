<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>阿瓦隆網頁小幫手</title>
    <style>
        :root {
            --panel-bg: rgba(18, 24, 43, 0.85);
            --panel-border: rgba(212, 175, 55, 0.4);
            --text-color: #e94560;
            --good-color: #4da6ff;
            --evil-color: #ff4d4d;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --purple: #b366ff;
            --warning-yellow: #ffcc00; 
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        /* 隱藏全域滾動條，但保留滾動功能 (針對 Webkit 瀏覽器如 Chrome, Safari) */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            /* 針對 Firefox, IE 隱藏滾動條 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 5px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 替換為 100dvh 修復 iOS Safari 底部導覽列問題 */
            min-height: 100dvh;
            background-image: linear-gradient(rgba(10, 15, 25, 0.85), rgba(10, 15, 25, 0.85)), url('https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            /* 防止下滑重新整理 */
            overscroll-behavior-y: contain; 
        }

        .screen {
            display: none;
            width: 100%;
            /* 稍微放大 max-width 以彌補移除 zoom 的大小 */
            max-width: 440px;
            background-color: var(--panel-bg);
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            padding: 25px 25px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid var(--panel-border);
            /* 移除了危險的 zoom: 1.1; 屬性 */
            box-sizing: border-box;
        }
        
        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1, h2, h3 { 
            color: var(--gold); 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); 
            letter-spacing: 1px;
        }
        h1 { margin-top: 0; margin-bottom: 20px; font-weight: 900; }
        
        .section-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 12px;
        }
        .section-title::before, .section-title::after {
            content: "";
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            flex: 1;
        }

        .good { color: var(--good-color); font-weight: bold; text-shadow: 0 0 5px rgba(77, 166, 255, 0.5);}
        .evil { color: var(--evil-color); font-weight: bold; text-shadow: 0 0 5px rgba(255, 77, 77, 0.5);}
        .purple { color: var(--purple); font-weight: bold; text-shadow: 0 0 5px rgba(179, 102, 255, 0.5);}

        .player-count-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 6px; 
            margin: 0 auto 15px auto; 
            width: 100%;
        }
        
        .pc-radio { display: none; }
        
        .pc-item {
            background: linear-gradient(145deg, rgba(30, 40, 60, 0.6), rgba(15, 20, 35, 0.8));
            border: 1px solid var(--glass-border); 
            border-radius: 6px; 
            padding: 6px 2px; 
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            /* 調整高度以彌補 zoom */
            min-height: 52px; 
        }

        .pc-item:hover {
            transform: translateY(-1px);
            background: linear-gradient(145deg, rgba(40, 50, 75, 0.7), rgba(20, 25, 45, 0.9));
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .pc-item .pc-number {
            font-size: 15px; 
            font-weight: 900;
            color: #ddd;
            margin-bottom: 2px;
            transition: color 0.3s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .pc-item .desc {
            font-size: 11px; 
            opacity: 0.9;
            background: rgba(0,0,0,0.4);
            padding: 1px 4px;
            border-radius: 4px;
        }

        .pc-radio:checked + .pc-item {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(40, 20, 10, 0.6)); 
            border: 2px solid var(--gold); 
            box-shadow: 
                0 0 10px rgba(212, 175, 55, 0.4), 
                inset 0 0 10px rgba(212, 175, 55, 0.1); 
            transform: translateY(-2px) scale(1.02); 
        }

        .pc-radio:checked + .pc-item .pc-number {
            color: var(--gold-light);
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.8);
        }

        .pc-radio:checked + .pc-item::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            transform: rotate(45deg);
            animation: shine 3s infinite linear;
            pointer-events: none;
        }

        .role-list { 
            text-align: center; 
            margin-bottom: 10px;
        }
        
        .role-checkbox { display: none; }

        .role-cards-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px; 
            align-items: center;
            margin-bottom: 15px;
        }

        .role-row {
            display: flex;
            justify-content: center;
            gap: 10px; 
        }

        .role-card-label {
            position: relative;
            /* 調整寬高以彌補 zoom */
            width: 82px; 
            height: 115px;
            border-radius: 8px;
            cursor: pointer;
            box-sizing: border-box;
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background-color: #111; 
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            user-select: none;
            -webkit-user-select: none;
        }

        .role-card-label img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            opacity: 0.4;
            filter: grayscale(90%);
            transition: all 0.3s ease-in-out;
        }

        .role-card-name {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            color: #888;
            font-size: 12px;
            padding: 4px 0;
            text-align: center;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            transition: all 0.3s ease-in-out;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backdrop-filter: blur(2px);
        }

        .role-card-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .role-checkbox:checked + .role-card-label.good {
            border-color: var(--good-color);
            box-shadow: 0 0 12px rgba(77, 166, 255, 0.6), inset 0 0 10px rgba(77, 166, 255, 0.2);
            transform: translateY(-3px) scale(1.02);
        }

        .role-checkbox:checked + .role-card-label.evil {
            border-color: var(--evil-color);
            box-shadow: 0 0 12px rgba(255, 77, 77, 0.6), inset 0 0 10px rgba(255, 77, 77, 0.2);
            transform: translateY(-3px) scale(1.02);
        }

        .role-checkbox:checked + .role-card-label img {
            opacity: 1;
            filter: grayscale(0%);
        }

        .role-checkbox:checked + .role-card-label.good .role-card-name {
            color: white;
            background: rgba(20, 80, 150, 0.85);
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(77, 166, 255, 0.5);
        }

        .role-checkbox:checked + .role-card-label.evil .role-card-name {
            color: white;
            background: rgba(150, 20, 20, 0.85);
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(255, 77, 77, 0.5);
        }

        #setup-error { 
            color: var(--warning-yellow); 
            font-weight: bold; 
            margin: 15px 0 10px; 
            min-height: 20px; 
            font-size: 14px;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        button {
            border: none;
            padding: 15px 30px;
            margin: 10px auto; 
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 900;
            letter-spacing: 1px;
            font-family: inherit;
        }
        
        .btn-gold { 
            background: linear-gradient(to bottom, #ebd197, #b5952f);
            color: #1a1a2e; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.6);
            border: 1px solid #7a631c;
            width: 100%;
        }
        .btn-gold:hover { 
            background: linear-gradient(to bottom, #f5dfa8, #c9a738);
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.8);
        }
        .btn-gold:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .card-container {
            perspective: 1000px; 
            border: none;
            padding: 0;
            margin: 20px auto; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            background-color: transparent;
            -webkit-touch-callout: none;
            /* 關閉預設滑動手勢，避免與系統或網頁上下滑動衝突 */
            touch-action: none;
            width: 100%; 
            /* 稍微放大以彌補 zoom */
            max-width: 310px;  
            height: 430px; 
            border-radius: 15px;
            -webkit-tap-highlight-color: transparent; 
        }

        .card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            position: relative;
            will-change: transform;
        }

        /* Flipped state */
        .card-inner.flipped { transform: rotateY(180deg); }

        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            transition: box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none; 
        }

        .card-back {
            background-color: transparent;
            justify-content: center;
            align-items: center;
        }

        .card-front {
            background-image: url('https://i.postimg.cc/Kz4pwxC0/66666.jpg');
            background-size: cover;
            background-position: center;
            transform: rotateY(180deg);
            box-sizing: border-box;
            border: 2px solid var(--panel-border); 
            display: block; 
            position: relative; 
            padding: 0; 
        }

        #card-back-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .card-back .instruction {
            position: absolute;
            bottom: 55px; 
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8);
            transition: opacity 0.2s;
        }

        .card-inner.flipped .instruction {
            opacity: 0;
        }
        
        #player-role-name {
            margin: 0;
            /* 調整字體大小彌補 zoom */
            font-size: 40px; 
            font-weight: 900;
            letter-spacing: 2px;
            position: absolute;
            top: 50px; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            z-index: 10;
        }

        #player-role-name.good {
            color: #d1e8ff; 
            text-shadow: 
                0 1px 0 var(--good-color), 
                0 2px 0 #2a7fcc, 
                0 3px 0 #1d66a6, 
                0 4px 0 #145082, 
                0 5px 0 #0d385e, 
                0 6px 0 #07223b, 
                0 8px 12px rgba(0, 0, 0, 0.9), 
                0 0 20px rgba(77, 166, 255, 0.5); 
        }

        #player-role-name.evil {
            color: #ffcccc; 
            text-shadow: 
                0 1px 0 var(--evil-color), 
                0 2px 0 #cc2929, 
                0 3px 0 #a61a1a, 
                0 4px 0 #821010, 
                0 5px 0 #5e0808, 
                0 6px 0 #3a0303, 
                0 8px 12px rgba(0, 0, 0, 0.9), 
                0 0 20px rgba(255, 77, 77, 0.5); 
        }

        .role-img {
            /* 調整大小彌補 zoom */
            width: 170px; 
            height: 170px;
            border-radius: 50%;
            border: 4px solid var(--gold);
            object-fit: contain; 
            display: block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            background-color: #111;
            pointer-events: none; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            margin: 0; 
        }

        #player-info-text { 
            /* 調整大小彌補 zoom */
            font-size: 18px; 
            line-height: 1.5; 
            background: transparent; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); 
            padding: 8px 10px; 
            border-radius: 8px; 
            box-sizing: border-box;
            position: absolute; 
            bottom: 50px; 
            left: 50%; 
            transform: translateX(-50%); 
            margin: 0; 
            width: 85%; 
        }
        
        #next-player-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            backdrop-filter: blur(5px);
        }
        #next-player-btn:hover { background: rgba(255,255,255,0.2); }

        #game-screen.active {
            display: flex;
            flex-direction: column;
            min-height: 500px; 
            padding: 0; 
        }
        
        #game-end-controls {
            flex: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(220, 20, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 20, 60, 0); }
        }

        @keyframes pulse-fast-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.9); }
            50% { box-shadow: 0 0 0 35px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        #reveal-all-btn {
            /* 調整大小彌補 zoom */
            width: 240px; 
            height: 240px; 
            padding: 15px; 
            font-size: 26px; 
            font-weight: 900; 
            border-radius: 50%; 
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            text-align: center;
            line-height: 1.4;
            margin: 0; 
            background: radial-gradient(circle, #b30000 0%, #500000 100%);
            color: #ffffff; 
            border: 4px solid #ff4d4d;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,0,0,0.3); 
            animation: pulse-red 2s infinite; 
            transition: all 0.3s ease;
        }

        #reveal-all-btn:hover {
            transform: scale(1.05); 
            background: radial-gradient(circle, #d60000 0%, #700000 100%);
            border-color: #ff6666;
            cursor: pointer;
        }

        #final-reveal-list {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 12px; 
            margin-top: 15px;
        }

        .reveal-card {
            position: relative;
            /* 調整大小彌補 zoom */
            width: 92px; 
            height: 130px; 
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #111;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .reveal-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.8);
        }

        .reveal-card.good {
            border-color: var(--good-color);
            box-shadow: 0 0 12px rgba(77, 166, 255, 0.6), inset 0 0 10px rgba(77, 166, 255, 0.2);
        }

        .reveal-card.evil {
            border-color: var(--evil-color);
            box-shadow: 0 0 12px rgba(255, 77, 77, 0.6), inset 0 0 10px rgba(255, 77, 77, 0.2);
        }

        .reveal-card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .reveal-card-id {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: var(--gold);
            font-size: 14px;
            font-weight: 900;
            padding: 3px 0;
            text-align: center;
            z-index: 2;
            backdrop-filter: blur(2px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .reveal-card-name {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            font-size: 13px;
            padding: 5px 0;
            text-align: center;
            z-index: 2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backdrop-filter: blur(2px);
        }

        .reveal-card.good .reveal-card-name {
            color: white;
            background: rgba(20, 80, 150, 0.85);
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(77, 166, 255, 0.5);
        }

        .reveal-card.evil .reveal-card-name {
            color: white;
            background: rgba(150, 20, 20, 0.85);
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(255, 77, 77, 0.5);
        }

        .player-number-text {
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .action-white-text {
            color: white; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="setup-screen" class="screen active">
        <h1 style="color: #e8c37d; text-transform: uppercase; letter-spacing: 2px;">阿瓦隆小幫手</h1>
        
        <div class="role-list">
            <h3 class="section-title">選擇遊戲人數</h3>
            
            <div class="player-count-grid">
                <input type="radio" name="player-count" id="pc-5" value="5" class="pc-radio">
                <label for="pc-5" class="pc-item">
                    <div class="pc-number">5 人</div>
                    <div class="desc"><span class="good">3好</span> <span class="evil">2壞</span></div>
                </label>
                
                <input type="radio" name="player-count" id="pc-6" value="6" class="pc-radio">
                <label for="pc-6" class="pc-item">
                    <div class="pc-number">6 人</div>
                    <div class="desc"><span class="good">4好</span> <span class="evil">2壞</span></div>
                </label>

                <input type="radio" name="player-count" id="pc-7" value="7" class="pc-radio">
                <label for="pc-7" class="pc-item">
                    <div class="pc-number">7 人</div>
                    <div class="desc"><span class="good">4好</span> <span class="evil">3壞</span></div>
                </label>

                <input type="radio" name="player-count" id="pc-8" value="8" class="pc-radio">
                <label for="pc-8" class="pc-item">
                    <div class="pc-number">8 人</div>
                    <div class="desc"><span class="good">5好</span> <span class="evil">3壞</span></div>
                </label>

                <input type="radio" name="player-count" id="pc-9" value="9" class="pc-radio">
                <label for="pc-9" class="pc-item">
                    <div class="pc-number">9 人</div>
                    <div class="desc"><span class="good">5好</span> <span class="evil">4壞</span></div>
                </label>

                <input type="radio" name="player-count" id="pc-10" value="10" class="pc-radio" checked>
                <label for="pc-10" class="pc-item">
                    <div class="pc-number">10 人</div>
                    <div class="desc"><span class="good">6好</span> <span class="evil">4壞</span></div>
                </label>
            </div>

            <h3 class="section-title">選擇特殊角色</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 12px;">空位將自動補齊 <span class="good">忠臣</span> 或 <span class="evil">爪牙</span></p>
            
            <div class="role-cards-wrapper">
                <div class="role-row">
                    <input type="checkbox" id="role-merlin" class="role-checkbox" checked>
                    <label for="role-merlin" class="role-card-label good">
                        <img src="https://i.postimg.cc/hjV0JNdY/7.jpg" alt="梅林">
                        <div class="role-card-name">梅林</div>
                    </label>

                    <input type="checkbox" id="role-percival" class="role-checkbox" checked>
                    <label for="role-percival" class="role-card-label good">
                        <img src="https://i.postimg.cc/pLhXMqBs/010.jpg" alt="派西維爾">
                        <div class="role-card-name">派西維爾</div>
                    </label>

                    <input type="checkbox" id="role-lizakang" class="role-checkbox">
                    <label for="role-lizakang" class="role-card-label good">
                        <img src="https://i.postimg.cc/vHSHKp5q/020.jpg" alt="李砸康">
                        <div class="role-card-name">李砸康</div>
                    </label>
                </div>

                <div class="role-row">
                    <input type="checkbox" id="role-mordred" class="role-checkbox" checked>
                    <label for="role-mordred" class="role-card-label evil">
                        <img src="https://i.postimg.cc/XvR8YnpP/2.jpg" alt="莫德雷德">
                        <div class="role-card-name">莫德雷德</div>
                    </label>

                    <input type="checkbox" id="role-morgana" class="role-checkbox" checked>
                    <label for="role-morgana" class="role-card-label evil">
                        <img src="https://i.postimg.cc/xdwR19c5/3.jpg" alt="莫甘娜">
                        <div class="role-card-name">莫甘娜</div>
                    </label>
                </div>

                <div class="role-row">
                    <input type="checkbox" id="role-assassin" class="role-checkbox" checked>
                    <label for="role-assassin" class="role-card-label evil">
                        <img src="https://i.postimg.cc/vmJzZGcz/4.jpg" alt="刺客">
                        <div class="role-card-name">刺客</div>
                    </label>

                    <input type="checkbox" id="role-oberon" class="role-checkbox" checked>
                    <label for="role-oberon" class="role-card-label evil">
                        <img src="https://i.postimg.cc/fLYv319B/1.jpg" alt="奧伯倫">
                        <div class="role-card-name">奧伯倫</div>
                    </label>
                </div>
            </div>
        </div>
        
        <div id="setup-error"></div>
        <button class="btn-gold" style="margin-top: 5px;" onclick="startGame()">開始分配角色</button>
    </div>

    <div id="pass-screen" class="screen">
        <h2 id="current-player-title"><span class="player-number-text">1號</span> <span class="action-white-text">請查驗身分 🔍</span></h2>
        
        <div class="card-container" id="reveal-card">
            <div class="card-inner" id="card-inner">
                <div class="card-face card-back">
                    <img src="https://i.postimg.cc/QdHBXdPk/card0back.png" alt="Avalon Card Back" id="card-back-img">
                    <div class="instruction">👆 點擊或滑動翻開</div>
                </div>
                <div class="card-face card-front" id="card-content">
                    <h2 id="player-role-name">角色名稱</h2>
                    <img id="player-role-img" class="role-img" src="" alt="角色圖片">
                    <div id="player-info-text">你的專屬資訊將顯示於此。</div>
                </div>
            </div>
        </div>
        
        <button id="next-player-btn" onclick="nextPlayer()" style="display:none; width:100%;">看完了 下一位</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="game-end-controls">
            <button id="reveal-all-btn" onclick="revealAll()">結束遊戲<br>查看所有人<br>身分</button>
        </div>

        <div id="final-reveal-area" style="display: none; margin-top: 10px;">
            <h3 class="section-title">真實身分揭曉</h3>
            <div id="final-reveal-list"></div>
            <button class="btn-gold" onclick="location.reload()" style="margin-top: 25px; padding: 15px 30px; font-size: 18px;">重新一局</button>
        </div>
    </div>

    <script>
        const preloadedBg = new Image();
        preloadedBg.src = "https://i.postimg.cc/Kz4pwxC0/66666.jpg";

        const roleData = {
            merlin: { name: "梅林", isEvil: false, img: "https://i.postimg.cc/hjV0JNdY/7.jpg" },
            percival: { name: "派西維爾", isEvil: false, img: "https://i.postimg.cc/pLhXMqBs/010.jpg" },
            lizakang: { name: "李砸康", isEvil: false, img: "https://i.postimg.cc/vHSHKp5q/020.jpg" },
            servant: { name: "亞瑟的忠臣", isEvil: false, img: "https://i.postimg.cc/JnjQySkx/5.jpg" },
            assassin: { name: "刺客", isEvil: true, img: "https://i.postimg.cc/vmJzZGcz/4.jpg" },
            morgana: { name: "莫甘娜", isEvil: true, img: "https://i.postimg.cc/xdwR19c5/3.jpg" },
            mordred: { name: "莫德雷德", isEvil: true, img: "https://i.postimg.cc/XvR8YnpP/2.jpg" },
            oberon: { name: "奧伯倫", isEvil: true, img: "https://i.postimg.cc/fLYv319B/1.jpg" },
            minion: { name: "莫德雷德的爪牙", isEvil: true, img: "https://i.postimg.cc/XJW6LdYF/8.jpg" }
        };

        Object.values(roleData).forEach(role => {
            const img = new Image();
            img.src = role.img;
        });

        const rules = {
            5: { good: 3, evil: 2 },
            6: { good: 4, evil: 2 },
            7: { good: 4, evil: 3 },
            8: { good: 5, evil: 3 },
            9: { good: 5, evil: 4 },
            10: { good: 6, evil: 4 }
        };

        let players = [];
        let currentPlayerIndex = 0;
        let isTransitioning = false; 

        document.addEventListener('DOMContentLoaded', () => {
            const countRadios = document.querySelectorAll('input[name="player-count"]');
            countRadios.forEach(radio => {
                radio.addEventListener('change', updateDefaultRoles);
            });
        });

        function updateDefaultRoles() {
            const checkedRadio = document.querySelector('input[name="player-count"]:checked');
            if (!checkedRadio) return;
            const count = parseInt(checkedRadio.value);
            
            const merlin = document.getElementById('role-merlin');
            const percival = document.getElementById('role-percival');
            const lizakang = document.getElementById('role-lizakang');
            const assassin = document.getElementById('role-assassin');
            const morgana = document.getElementById('role-morgana');
            const mordred = document.getElementById('role-mordred');
            const oberon = document.getElementById('role-oberon');

            merlin.checked = false;
            percival.checked = false;
            lizakang.checked = false;
            assassin.checked = false;
            morgana.checked = false;
            mordred.checked = false;
            oberon.checked = false;

            switch(count) {
                case 5:
                    merlin.checked = true;
                    assassin.checked = true;
                    break;
                case 6:
                    merlin.checked = true;
                    lizakang.checked = true;
                    mordred.checked = true;
                    assassin.checked = true;
                    break;
                case 7:
                    merlin.checked = true;
                    percival.checked = true;
                    mordred.checked = true;
                    morgana.checked = true;
                    oberon.checked = true;
                    break;
                case 8:
                    merlin.checked = true;
                    percival.checked = true;
                    mordred.checked = true;
                    morgana.checked = true;
                    assassin.checked = true;
                    break;
                case 9:
                    merlin.checked = true;
                    percival.checked = true;
                    lizakang.checked = true;
                    assassin.checked = true;
                    morgana.checked = true;
                    mordred.checked = true;
                    oberon.checked = true;
                    break;
                case 10:
                    merlin.checked = true;
                    percival.checked = true;
                    assassin.checked = true;
                    morgana.checked = true;
                    mordred.checked = true;
                    oberon.checked = true;
                    break;
            }
        }

        let forceStartWithoutGood = false; 

        function startGame() {
            const errorEl = document.getElementById('setup-error');
            errorEl.innerText = "";
            currentPlayerIndex = 0; 
            players = [];

            const playerCount = parseInt(document.querySelector('input[name="player-count"]:checked').value);
            const ratio = rules[playerCount];

            let goodRoles = [];
            let evilRoles = [];

            if(document.getElementById('role-merlin').checked) goodRoles.push('merlin');
            if(document.getElementById('role-percival').checked) goodRoles.push('percival');
            if(document.getElementById('role-lizakang').checked) goodRoles.push('lizakang');
            if(document.getElementById('role-assassin').checked) evilRoles.push('assassin');
            if(document.getElementById('role-morgana').checked) evilRoles.push('morgana');
            if(document.getElementById('role-mordred').checked) evilRoles.push('mordred');
            if(document.getElementById('role-oberon').checked) evilRoles.push('oberon');

            if(goodRoles.length > ratio.good || evilRoles.length > ratio.evil) {
                errorEl.innerText = `⚠️ ${ratio.good}名好人與${ratio.evil}名壞人。請調整角色！`;
                forceStartWithoutGood = false; 
                return;
            }

            if(goodRoles.length === 0 && ratio.good > 0) {
                 if(!forceStartWithoutGood) {
                     errorEl.innerHTML = "⚠️ 警告：目前正義方沒有任何特殊角色。<br><strong>請再次點擊「開始」以確認執行。</strong>";
                     forceStartWithoutGood = true;
                     return;
                 }
            }

            while(goodRoles.length < ratio.good) goodRoles.push('servant');
            while(evilRoles.length < ratio.evil) evilRoles.push('minion');

            let selectedRoles = goodRoles.concat(evilRoles);
            selectedRoles = selectedRoles.sort(() => Math.random() - 0.5);

            players = selectedRoles.map((roleKey, index) => {
                return {
                    id: index + 1,
                    roleKey: roleKey,
                    role: roleData[roleKey],
                    info: ""
                };
            });

            generateInfo();

            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('pass-screen').classList.add('active');
            showPlayerPassScreen();
        }

        function generateInfo() {
            const teamEvil = players.filter(p => p.role.isEvil && p.roleKey !== 'oberon').map(p => p.id + "號");
            const seenByMerlin = players.filter(p => p.role.isEvil && p.roleKey !== 'mordred').map(p => p.id + "號");
            const seenByPercival = players.filter(p => p.roleKey === 'merlin' || p.roleKey === 'morgana').map(p => p.id + "號");

            let seenByLiZakang = players.filter(p => p.roleKey === 'merlin' || p.roleKey === 'mordred').map(p => p.id + "號");
            seenByLiZakang = seenByLiZakang.sort(() => Math.random() - 0.5);

            players.forEach(p => {
                if (p.roleKey === 'merlin') {
                    p.info = `你看到的壞人<br><strong class="evil">${seenByMerlin.join(' ') || '無'}</strong>`;
                } else if (p.roleKey === 'percival') {
                    p.info = `梅林或莫甘娜<br><strong class="purple">${seenByPercival.join(' ') || '無'}</strong>`;
                } else if (p.roleKey === 'lizakang') {
                    if(seenByLiZakang.length > 0) {
                         p.info = `梅林或莫德雷德<br><strong class="purple">${seenByLiZakang.join(' ')}</strong>`;
                    } else {
                         p.info = "你感應到了無盡的虛空。<br>本局似乎沒有相關特殊角色。";
                    }
                } else if (p.role.isEvil && p.roleKey !== 'oberon') {
                    const otherEvils = teamEvil.filter(id => id !== p.id + "號");
                    if(otherEvils.length > 0) {
                        p.info = `你的壞人同伴<br><strong class="evil">${otherEvils.join(' ')}</strong>`;
                    } else {
                        p.info = "你是唯一的邪惡陣營<br>(或其他人是奧伯倫)。";
                    }
                } else if (p.roleKey === 'oberon') {
                    p.info = "只知道自己是壞人<br>沒有其他資訊";
                } else {
                    p.info = "你是普通忠臣<br>沒有其他資訊";
                }
            });
        }

        const revealCardWrapper = document.getElementById('reveal-card');
        const nextBtn = document.getElementById('next-player-btn');
        const cardInner = document.getElementById('card-inner');

        function triggerVibration(pattern) {
            if ('vibrate' in navigator) {
                try { navigator.vibrate(pattern); } catch(e) {}
            }
        }

        let touchStartX = 0;
        let touchStartY = 0;
        
        function handleCardPress() {
            if (isTransitioning || cardInner.classList.contains('flipped')) return;
            cardInner.style.transform = 'scale(0.95)';
            cardInner.style.transition = 'transform 0.1s ease';
            triggerVibration(15); 
        }

        function handleCardRelease(isAction = false) {
            if (isTransitioning || cardInner.classList.contains('flipped')) return;
            
            cardInner.style.transform = '';
            cardInner.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)'; 
            
            if (isAction) {
                flipCard();
            }
        }

        revealCardWrapper.addEventListener('mousedown', handleCardPress);
        revealCardWrapper.addEventListener('mouseleave', () => {
             if (!cardInner.classList.contains('flipped')) handleCardRelease(false);
        });
        revealCardWrapper.addEventListener('mouseup', () => handleCardRelease(true));

        revealCardWrapper.addEventListener('touchstart', (e) => {
            if(isTransitioning) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            handleCardPress();
        }, {passive: true});

        revealCardWrapper.addEventListener('touchmove', (e) => {
            if (cardInner.classList.contains('flipped') || isTransitioning) return;
            
            const touchX = e.changedTouches[0].screenX;
            const touchY = e.changedTouches[0].screenY;
            const deltaX = touchX - touchStartX;
            const deltaY = touchY - touchStartY;

            const rotateX = Math.max(-12, Math.min(12, -deltaY / 6));
            const rotateY = Math.max(-12, Math.min(12, deltaX / 6));

            cardInner.style.transform = `scale(0.95) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }, {passive: true});

        revealCardWrapper.addEventListener('touchend', (e) => {
            if (cardInner.classList.contains('flipped') || isTransitioning) return;
            handleCardRelease(true);
        });

        function flipCard() {
            if (isTransitioning) return; 
            if (cardInner.classList.contains('flipped')) return;

            cardInner.classList.add('flipped');
            nextBtn.style.display = 'block'; 

            triggerVibration([40, 50, 30]);

            const player = players[currentPlayerIndex];
            document.getElementById('current-player-title').innerHTML = `<span class="player-number-text">${player.id}號</span> <span class="action-white-text">你的身分是 ⬇️</span>`;
        }

        function showPlayerPassScreen() {
            const player = players[currentPlayerIndex];
            
            document.getElementById('current-player-title').innerHTML = `<span class="player-number-text">${player.id}號</span> <span class="action-white-text">請查驗身分 🔍</span>`;
            
            const roleNameEl = document.getElementById('player-role-name');
            roleNameEl.innerText = player.role.name;
            roleNameEl.className = player.role.isEvil ? 'evil' : 'good';
            
            const roleImgEl = document.getElementById('player-role-img');
            roleImgEl.src = ""; 
            
            setTimeout(() => {
                roleImgEl.src = player.role.img;
            }, 10);
            
            const infoTextEl = document.getElementById('player-info-text');
            infoTextEl.innerHTML = player.info;
            
            infoTextEl.className = '';

            if (currentPlayerIndex === players.length - 1) {
                nextBtn.innerText = "看完了 遊戲開始";
            } else {
                nextBtn.innerText = "看完了 下一位";
            }
        }

        function nextPlayer() {
            if (isTransitioning) return; 
            isTransitioning = true; 

            nextBtn.style.display = 'none';
            cardInner.classList.remove('flipped');

            const player = players[currentPlayerIndex];
            document.getElementById('current-player-title').innerHTML = `<span class="player-number-text">${player.id}號</span> <span class="action-white-text">請查驗身分 🔍</span>`;

            setTimeout(() => {
                if (currentPlayerIndex < players.length - 1) {
                    currentPlayerIndex++;
                    showPlayerPassScreen(); 
                } else {
                    document.getElementById('pass-screen').classList.remove('active');
                    showGameScreen();
                }
                
                isTransitioning = false; 
            }, 600);
        }

        function showGameScreen() {
            const gameScreen = document.getElementById('game-screen');
            gameScreen.style.minHeight = '500px'; 
            gameScreen.style.display = 'flex';
            gameScreen.classList.add('active');
        }

        let confirmRevealActive = false;
        let revealTimeout;

        function revealAll() {
            const btn = document.getElementById('reveal-all-btn');

            if (!confirmRevealActive) {
                triggerVibration([50]); 
                confirmRevealActive = true;
                btn.innerHTML = "⚠️ 確定揭曉？<br><span style='font-size:16px; font-weight:normal;'>(再次點擊確認，不可逆)</span>";
                btn.style.animation = "pulse-fast-red 0.5s infinite";
                btn.style.border = "4px solid white";
                
                revealTimeout = setTimeout(() => {
                    confirmRevealActive = false;
                    btn.innerHTML = "結束遊戲<br>查看所有人<br>身分";
                    btn.style.animation = "pulse-red 2s infinite";
                    btn.style.border = "4px solid #ff4d4d";
                }, 3500);
                return;
            }

            clearTimeout(revealTimeout);
            triggerVibration([100, 50, 100]); 
            
            const revealArea = document.getElementById('final-reveal-area');
            const listEl = document.getElementById('final-reveal-list');
            const gameEndControls = document.getElementById('game-end-controls'); 
            const gameScreen = document.getElementById('game-screen');
            
            const sortedPlayers = [...players].sort((a, b) => a.id - b.id);
            
            const renderItem = p => `
                <div class="reveal-card ${p.role.isEvil ? 'evil' : 'good'}">
                    <div class="reveal-card-id">${p.id}號</div>
                    <img src="${p.role.img}" alt="${p.role.name}">
                    <div class="reveal-card-name">${p.role.name}</div>
                </div>`;
            
            listEl.innerHTML = sortedPlayers.map(renderItem).join('');
            
            revealArea.style.display = 'block';
            gameEndControls.style.display = 'none'; 
            gameScreen.style.minHeight = 'auto';
            gameScreen.style.display = 'block'; 
            gameScreen.style.padding = '25px';

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
